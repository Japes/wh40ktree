<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineage of the Adeptus Astartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eaee; --surface:#f5f6f8; --ink:#1a2130; --muted:#5b6474; --brass:#86662a;
  --line:rgba(134,102,42,.55); --band-a:rgba(26,33,48,.045); --band-b:rgba(26,33,48,0);
  --traitor:#9b2f2c; --sel:rgba(134,102,42,.18); --shadow:rgba(20,26,38,.18);
  --star-rgb:38,46,68; --star-a:.5; --neb1:rgba(120,96,170,.10); --neb2:rgba(70,120,180,.09); --neb3:rgba(134,102,42,.06);
  --display:"Cinzel", "Trajan Pro", "Times New Roman", serif;
  --ui:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --surface:#1a2230; --ink:#e6dec9; --muted:#939cab; --brass:#c9a35c;
    --line:rgba(201,163,92,.42); --band-a:rgba(230,222,201,.035); --band-b:rgba(230,222,201,0);
    --traitor:#d26a63; --sel:rgba(201,163,92,.16); --shadow:rgba(0,0,0,.45);
    --star-rgb:232,226,210; --star-a:1; --neb1:rgba(110,70,170,.20); --neb2:rgba(40,100,160,.18); --neb3:rgba(201,163,92,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --surface:#1a2230; --ink:#e6dec9; --muted:#939cab; --brass:#c9a35c;
  --line:rgba(201,163,92,.42); --band-a:rgba(230,222,201,.035); --band-b:rgba(230,222,201,0);
  --traitor:#d26a63; --sel:rgba(201,163,92,.16); --shadow:rgba(0,0,0,.45);
  --star-rgb:232,226,210; --star-a:1; --neb1:rgba(110,70,170,.20); --neb2:rgba(40,100,160,.18); --neb3:rgba(201,163,92,.07);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}

/* ---------- top bar ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
.title h1{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.04em;margin:0;line-height:1.1}
.title p{margin:.1rem 0 0;color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-left:auto}
.tools input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.38rem .6rem;width:14rem;max-width:60vw}
.btn{background:transparent;border:1px solid var(--line);border-radius:4px;padding:.34rem .7rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sel)}
.btn[aria-pressed="false"]{color:var(--muted)}
.zoom{display:flex}
.zoom .btn{border-radius:0;min-width:2.2rem}
.zoom .btn:first-child{border-radius:4px 0 0 4px}
.zoom .btn:last-child{border-radius:0 4px 4px 0;border-left:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage #panel{-webkit-user-select:text;user-select:text;cursor:auto}
#stage.dragging{cursor:grabbing}
svg#tree{position:absolute;inset:0;width:100%;height:100%;display:block}
#ages{position:absolute;top:0;left:0;right:0;height:24px;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden}
.age{position:absolute;top:0;height:24px;padding:0 .7rem;border-left:1px solid var(--line);font-family:var(--display);font-size:.72rem;font-weight:700;letter-spacing:.04em;line-height:24px;color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age.alt{background:var(--band-a)}
.age[data-age]{cursor:pointer}
.age[data-age]:hover,.age.sel{background:var(--sel)}
.age.sel{text-decoration:underline;text-underline-offset:3px}
.age.vague{color:var(--muted);font-family:var(--ui);font-weight:400;font-style:italic;letter-spacing:0}
#cols{position:absolute;top:24px;left:0;right:0;height:84px;pointer-events:none;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.col{position:absolute;top:0;height:84px;padding:.5rem .7rem 0;border-left:1px solid var(--line);overflow:hidden;white-space:nowrap}
.col b{display:block;font-family:var(--display);font-weight:700;font-size:.9rem;line-height:1.2;letter-spacing:.03em;color:var(--brass);overflow:hidden;text-overflow:ellipsis}
.col i{display:block;font-size:.8rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.col span{display:block;font-size:.75rem;color:var(--muted)}
.col.narrow i,.col.narrow span{display:none}
.col.tiny{visibility:hidden}
.col.unrec{border-left-style:dashed}
#cols .col{pointer-events:auto;cursor:pointer}
#cols .col:hover,#cols .col.sel{background:var(--sel)}
#cols .col.sel b{text-decoration:underline;text-underline-offset:3px}

.band{fill:var(--band-a)}
.band.alt{fill:var(--band-b)}
.band.unrec{fill:none;stroke:var(--line);stroke-dasharray:4 6}
.edge{fill:none;stroke:var(--line);stroke-width:1.4}
.edge.to-traitor{stroke:var(--traitor);stroke-opacity:.45;stroke-dasharray:3 4}
.node{cursor:pointer;outline:none}
.node .hit{fill:transparent;rx:4}
.node:hover .hit,.node:focus-visible .hit{fill:var(--sel)}
.node.sel .hit{fill:var(--sel);stroke:var(--brass);stroke-width:1}
.node text.lbl{font-family:var(--ui);font-size:14px;fill:var(--ink);dominant-baseline:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;stroke-opacity:.85}
#sky{position:absolute;inset:0;pointer-events:none;background-repeat:repeat,repeat,repeat,no-repeat,no-repeat,no-repeat}
.node.legion text.lbl{font-weight:700;font-size:17px}
.node.root text.lbl{font-family:var(--display);font-weight:700;font-size:30px;fill:var(--brass)}
.node.group text.lbl{font-style:italic;fill:var(--muted)}
.node.traitor text.lbl{fill:var(--traitor)}
.node.lost text.lbl,.node.expunged text.lbl{font-style:italic;fill:var(--muted)}
.node.conn{opacity:.45}
.node .count{fill:var(--muted);font-weight:400;font-size:12px}
.sh-o{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:.9}
.node.traitor .sh-o{stroke:var(--traitor);stroke-opacity:1;stroke-dasharray:2 1.5}
.knob circle{fill:var(--surface);stroke:var(--brass);stroke-width:1.3}
.knob text{fill:var(--brass);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.knob:hover circle{fill:var(--brass)}
.knob:hover text{fill:var(--surface)}

.hint{position:absolute;left:1rem;bottom:.8rem;font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.3rem .6rem;pointer-events:none;z-index:2}

/* ---------- detail panel ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px var(--shadow);z-index:4;overflow-y:auto;padding:1.2rem 1.3rem 2rem;transform:translateX(105%);transition:transform .22s ease}
#panel.open{transform:none}
@media (prefers-reduced-motion: reduce){#panel{transition:none}}
#panel .close{position:absolute;top:.7rem;right:.7rem}
.crest{display:flex;gap:1rem;align-items:center;margin:.4rem 0 1rem}
.crest .shield{position:relative;width:84px;height:100px;flex:none}
.crest .shield svg,.crest .shield img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#panel h2{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0}
.status{font-size:.92rem;color:var(--muted);margin-top:.2rem}
.status.traitor{color:var(--traitor)}
#panel dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;margin:0 0 1rem}
#panel dt{color:var(--muted);font-size:.9rem}
#panel dd{margin:0}
.linkish{background:none;border:0;padding:0;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.kids{display:flex;flex-wrap:wrap;gap:.25rem .7rem}
.note{max-width:62ch;margin:0 0 1.2rem}
.note.aside{margin-top:-.6rem;font-size:.9rem;color:var(--muted)}
#panel h3{font-family:var(--display);font-size:.95rem;font-weight:700;color:var(--brass);margin:1.2rem 0 .5rem;letter-spacing:.03em}
.wikis{display:flex;gap:.45rem}
.wikis a{flex:1;min-width:0;text-align:center;border:1px solid var(--line);border-radius:4px;padding:.5rem .4rem;color:var(--ink);text-decoration:none;font-weight:500}
.wikis a:hover{background:var(--sel)}
.wikis a small{display:block;color:var(--muted);font-size:.82rem}
.fine{font-size:.82rem;color:var(--muted);margin-top:1.2rem}

/* ---------- feedback dialog ---------- */
#fb{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.3rem;width:min(460px,calc(100% - 2rem));box-shadow:0 12px 40px var(--shadow)}
#fb::backdrop{background:rgba(10,14,20,.55)}
#fb h2{font-family:var(--display);font-size:1.15rem;margin:0 0 .3rem}
#fb p.intro{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
#fb label{display:block;font-size:.88rem;color:var(--muted);margin:.7rem 0 .25rem}
#fb select,#fb input,#fb textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;font:inherit;color:inherit}
#fb textarea{min-height:7rem;resize:vertical}
#fb .row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
#fb .btn.primary{background:var(--brass);color:var(--surface);border-color:var(--brass)}
#fb .status{font-size:.88rem;color:var(--brass);margin-top:.6rem;min-height:1.2em}

@media (max-width: 700px){
  header{padding:.6rem .8rem}
  .title p{display:none}
  .tools{margin-left:0;width:100%}
  .tools input[type=search]{flex:1;width:auto}
  #panel{top:auto;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);transform:translateY(105%);box-shadow:0 -8px 24px var(--shadow)}
  #panel.open{transform:none}
  .hint{display:none}
}
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Lineage of the Adeptus Astartes</h1>
    <p>Read left to right: from the Emperor’s twenty Legions to the Ultima Founding and the Chapters that fell.</p>
  </div>
  <div class="tools">
    <input type="search" id="search" list="names" placeholder="Find a Legion or Chapter" aria-label="Find a Legion or Chapter">
    <datalist id="names"></datalist>
    <button class="btn" id="loyalists" aria-pressed="true">Loyalists shown</button>
    <button class="btn" id="traitors" aria-pressed="true">Traitors shown</button>
    <button class="btn" id="expandAll">Expand all</button>
    <button class="btn" id="collapseAll">Legions only</button>
    <button class="btn" id="feedbackBtn">Feedback</button>
    <div class="zoom">
      <button class="btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="btn" id="fit">Fit</button>
      <button class="btn" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>
</header>

<div id="stage">
  <div id="sky" aria-hidden="true"></div>
  <svg id="tree" aria-label="Family tree of Space Marine Legions and Chapters"><g id="world"></g></svg>
  <div id="ages" aria-label="Ages of the Imperium"></div>
  <div id="cols"></div>
  <div class="hint">Drag to pan, scroll or pinch to zoom. Click a ± knob to fold a branch.</div>
  <aside id="panel" aria-live="polite" aria-label="Details"></aside>
</div>

<dialog id="fb" aria-labelledby="fbTitle">
  <h2 id="fbTitle">Feedback</h2>
  <p class="intro">Spotted a mistake, a missing Chapter, or have an idea? Let me know.</p>
  <label for="fbType">Type</label>
  <select id="fbType"><option>Correction</option><option>Missing Chapter</option><option>Suggestion</option><option>Bug</option></select>
  <label for="fbEntry">Legion or Chapter (optional)</label>
  <input id="fbEntry" list="names" autocomplete="off">
  <label for="fbMsg">Details, ideally with a source</label>
  <textarea id="fbMsg"></textarea>
  <label for="fbFrom">Your email (optional, if you’d like a reply)</label>
  <input id="fbFrom" type="email" autocomplete="email">
  <div class="status" id="fbStatus" role="status"></div>
  <div class="row">
    <button class="btn" id="fbCancel">Cancel</button>
    <button class="btn primary" id="fbSend">Send</button>
  </div>
</dialog>

<script src="heraldry/index.js"></script>
<script>
/* =====================================================================
   HERALDRY IMAGES
   The hosted preview can’t load images from other sites, so shields fall
   back to a two-colour scheme swatch. Once you self-host, save badge images
   next to this file and either map ids individually or set a pattern:
     HERALDRY_PATTERN = "heraldry/{id}.png";
   Ids are the lowercase-hyphenated names in NODES below.
   ===================================================================== */
const HERALDRY = { /* "ultramarines": "heraldry/ultramarines.png" */ };
const HERALDRY_PATTERN = "";
// Written by fetch_heraldry.py: { id: "heraldry/<file>" } for every badge it downloaded.
// Loaded automatically on your own host; entries without a badge keep the colour shield.
const HERALDRY_MANIFEST = "heraldry/index.json";
const HERALDRY_SOURCE = { label: "Warhammer 40k Wiki (Fandom)", url: "https://warhammer40k.fandom.com" };

/* FEEDBACK: where the Feedback form sends messages once you self-host.
   formspree: your Formspree form ID (the part after /f/ in its endpoint, e.g. "xyzabcde").
              Messages are emailed to you without your address appearing in this page.
   github / email: alternatives, used only if formspree is empty.
   With none set, the message is copied to the clipboard. */
const FEEDBACK = { formspree: "mjywkobe", github: "", email: "" };

/* ANALYTICS: GoatCounter (free for non-commercial sites, no cookies, nothing shown to visitors).
   Set this to your GoatCounter code, the first part of your dashboard address
   (for astartes.goatcounter.com, use "astartes"). Leave empty to disable. */
const ANALYTICS = { goatcounter: "japes55" };
if (ANALYTICS.goatcounter && location.protocol.startsWith("http")) {
  const gc = document.createElement("script");
  gc.async = true;
  gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${ANALYTICS.goatcounter}.goatcounter.com/count`;
  document.head.appendChild(gc);
}
// Also records which Legions and Chapters people open, as events in the dashboard
function trackView(n) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: "entry/" + n.id, title: n.name, event: true }); } catch {}
} // e.g. the archived database page, shown as a credit link

/* ===================== FOUNDINGS (oldest first) ===================== */
const COLS = [
  {id:"origin", name:"Origin", ep:"", date:"M30"},
  {id:"f1", name:"1st Founding", ep:"The Legiones Astartes", date:"M29–M30"},
  {id:"secret", name:"Outside the Foundings", ep:"Raised in secret", date:"M31"},
  {id:"warbands", name:"Traitor warbands", ep:"Splintered after the Heresy", date:"M31 onward", era:true},
  {id:"f2", name:"2nd Founding", ep:"The Legions divided", date:"021.M31"},
  {id:"u-m31", name:"Unnumbered Foundings", ep:"Founding number unstated", date:"M31"},
  {id:"f3", name:"3rd Founding", ep:"Proposed by Rogal Dorn", date:"001.M32"},
  {id:"f4", name:"4th Founding", ep:"After the War of the Beast", date:"546.M32"},
  {id:"f8", name:"8th Founding", ep:"", date:"Mid-M34"},
  {id:"f9", name:"9th Founding", ep:"", date:"Date unknown"},
  {id:"f10", name:"10th Founding", ep:"", date:"Mid-M35", note:"Only some Chapters’ placement in this Founding is confirmed."},
  {id:"u-m32", name:"Unnumbered Foundings", ep:"Between the 3rd and 12th", date:"M32–M35"},
  {id:"f13", name:"13th Founding", ep:"The Dark Founding", date:"Late M35–early M36"},
  {id:"f17", name:"17th Founding", ep:"", date:"Date unknown"},
  {id:"u-m36", name:"Unnumbered Foundings", ep:"Between the 14th and 20th", date:"M36"},
  {id:"f21", name:"21st Founding", ep:"The Cursed Founding", date:"991.M35", note:"Some sources date it before the 13th; it’s shown here in numbered order."},
  {id:"edict", name:"Ratified by edict", ep:"Outside the Foundings", date:"011.M37"},
  {id:"f23", name:"23rd Founding", ep:"The Sentinel Founding", date:"Late M37–early M38"},
  {id:"f24", name:"24th Founding", ep:"", date:"Date unknown"},
  {id:"f25", name:"25th Founding", ep:"The Bastion Founding", date:"Late M40"},
  {id:"f26", name:"26th Founding", ep:"", date:"738.M41"},
  {id:"u-late", name:"Unnumbered Foundings", ep:"Between the 22nd and 26th", date:"M37–M41"},
  {id:"ultima", name:"Ultima Founding", ep:"Primaris Chapters", date:"c. 999.M41"},
  {id:"unrec", name:"Founding unrecorded", ep:"Number or date lost", date:"Any era"},
  {id:"fallen", name:"Fallen to Chaos", ep:"Loyal Chapters turned renegade", date:"Mostly M41", era:true}
];

/* ===================== LEGIONS & CHAPTERS =====================
   f: founding id   p: gene-seed parent id   c: [primary, secondary] colour
   s: loyal | traitor | lost | renegade | expunged | root | group
   n: note          num: Legion numeral
   lex / fan / d4: page-title overrides for Lexicanum, Fandom, 2d4chan  */
const NODES = [
  {id:"emperor", name:"The Emperor of Mankind", f:"origin", s:"root", c:["#c9a35c","#7d6331"], n:"Source of all Astartes gene-seed, carried through the twenty Primarchs.", lex:"Emperor of Mankind", fan:"Emperor of Mankind", d4:"God-Emperor of Mankind", d:"Master of Mankind and creator of the twenty Primarchs. Entombed on the Golden Throne since the Heresy, he is worshipped as a god across the Imperium."},

  // First Founding — the Legions
  {id:"dark-angels", name:"Dark Angels", num:"I", f:"f1", p:"emperor", c:["#1f3d2b","#cdb98f"], n:"Primarch Lion El’Jonson. Homeworld Caliban.", d:"The First Legion, led by Lion El’Jonson of Caliban. Secretive and proud, they hide the shame of the Fallen while hunting them relentlessly."},
  {id:"ii-legion", name:"II Legion", num:"II", f:"f1", p:"emperor", s:"expunged", c:["#5a5f66","#3b3f45"], n:"One of two Legions whose records were expunged from Imperial archives.", d:"One of two Legions whose records were wiped from every Imperial archive. Their name, Primarch and fate are deliberately forgotten."},
  {id:"emperors-children", name:"Emperor’s Children", num:"III", f:"f1", p:"emperor", s:"traitor", c:["#5e2a6b","#d0ac4a"], n:"Primarch Fulgrim. Joined Horus in the Heresy.", d:"Fulgrim’s Legion, obsessed with perfection. After siding with Horus they gave themselves to Slaanesh, chasing ever more extreme sensation and excess."},
  {id:"iron-warriors", name:"Iron Warriors", num:"IV", f:"f1", p:"emperor", s:"traitor", c:["#7d8288","#d2ac2f"], n:"Primarch Perturabo. Joined Horus in the Heresy.", d:"Perturabo’s siege-masters from Olympia. Embittered by thankless garrison duty, they joined Horus and still wage the Long War from the daemon world Medrengard."},
  {id:"white-scars", name:"White Scars", num:"V", f:"f1", p:"emperor", c:["#ece8de","#a62324"], n:"Primarch Jaghatai Khan. Homeworld Chogoris.", d:"Jaghatai Khan’s Legion from Chogoris, masters of lightning-fast mobile warfare on bikes and speeders, and fiercely loyal throughout the Heresy."},
  {id:"space-wolves", name:"Space Wolves", num:"VI", f:"f1", p:"emperor", c:["#7f93a4","#c9a24d"], n:"Primarch Leman Russ. Homeworld Fenris. Never fully adopted the Codex Astartes.", d:"Leman Russ’s savage Legion from icy Fenris. They never fully adopted the Codex Astartes and keep their own fierce, saga-steeped traditions."},
  {id:"imperial-fists", name:"Imperial Fists", num:"VII", f:"f1", p:"emperor", c:["#e2b42a","#1d1d1d"], n:"Primarch Rogal Dorn. Defenders of Terra during the Siege.", d:"Rogal Dorn’s Legion, unmatched in siegecraft and defence. They held the walls of the Imperial Palace during the Siege of Terra."},
  {id:"night-lords", name:"Night Lords", num:"VIII", f:"f1", p:"emperor", s:"traitor", c:["#1e2b55","#b9bcc2"], n:"Primarch Konrad Curze. Joined Horus in the Heresy.", d:"Konrad Curze’s Legion from Nostramo, who waged war through terror. They joined Horus and now raid the Imperium as pirates and murderers."},
  {id:"blood-angels", name:"Blood Angels", num:"IX", f:"f1", p:"emperor", c:["#9e1b1d","#d4ab3e"], n:"Primarch Sanguinius. Homeworld Baal.", d:"Sanguinius’s noble Legion from Baal, cursed by the Red Thirst and the Black Rage after their Primarch died at Horus’s hands."},
  {id:"iron-hands", name:"Iron Hands", num:"X", f:"f1", p:"emperor", c:["#202224","#a2a8ae"], n:"Primarch Ferrus Manus. Homeworld Medusa.", d:"Ferrus Manus’s Legion from Medusa, who replace weak flesh with machinery. They were shattered at Isstvan V when their Primarch was slain."},
  {id:"xi-legion", name:"XI Legion", num:"XI", f:"f1", p:"emperor", s:"expunged", c:["#5a5f66","#3b3f45"], n:"One of two Legions whose records were expunged from Imperial archives.", d:"One of two Legions whose records were wiped from every Imperial archive. Their name, Primarch and fate are deliberately forgotten."},
  {id:"world-eaters", name:"World Eaters", num:"XII", f:"f1", p:"emperor", s:"traitor", c:["#e7e2d7","#2e4f8f"], n:"Primarch Angron. Joined Horus in the Heresy.", d:"Angron’s berserkers, driven by the implanted Butcher’s Nails. They fell to Khorne and splintered into countless warbands after the battle of Skalathrax."},

}
function wrapLines(text, font, maxW, maxLines) {
  measureCtx.font = font;
  const lines = []; let cur = "";
  for (const w of text.split(" ")) {
    const t = cur ? cur + " " + w : w;
    if (!cur || measureCtx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) lines.splice(maxLines - 1, lines.length, lines.slice(maxLines - 1).join(" "));
  return lines;
}
function labelMarkup(n, x, has) {
  const token = has && collapsed.has(n.id) ? `(+${countDesc(n)})` : "";
  const isRoot = n.s === "root";
  // stop before the knob, or before the next column (the large root title gets the column's full width)
  const maxW = (isRoot ? ROOT_KNOB_X - 14 : has ? BW - 20 : 210 - 6) - x;
  const lines = wrapLines(n.name + (token ? " " + token : ""), labelFont(n), maxW, isRoot ? 4 : 2);
  const lh = isRoot ? 33 : n.num ? 17 : 15, y0 = 1 - (lines.length - 1) * lh / 2;
  const spans = lines.map((ln, i) => {
    let body = esc(ln);
    if (token && i === lines.length - 1 && ln.endsWith(token)) {
      const main = ln.slice(0, -token.length).trimEnd();
      body = `${esc(main)}<tspan class="count">${main ? " " : ""}${token}</tspan>`;
    }
    return `<tspan x="${x}" y="${y0 + i * lh}">${body}</tspan>`;
  }).join("");
  return `<text class="lbl" text-anchor="start">${spans}</text>`;
}

/* A soft golden radiance behind the root, kept inside the first column */
function radianceMarkup() {
  const root = byId.emperor;
  if (root.y == null || !(root.f in colPos)) return "";
  const x0 = colLeft(colPos[root.f]), cx = nodeL(root) + 92, cy = root.y, R = 230;
  let rays = "";
  for (let i = 0; i < 32; i++) {
    const a = (i / 32) * Math.PI * 2 + 0.05, long = i % 2 === 0;
    const len = long ? R : R * 0.62, w = (long ? 1.9 : 1.2) * Math.PI / 180;
    const p = (ang, r) => `${(Math.cos(ang) * r).toFixed(1)} ${(Math.sin(ang) * r).toFixed(1)}`;
    rays += `<path d="M0 0L${p(a - w, len)}L${p(a + w, len)}Z"/>`;
  }
  return `<defs>
    <radialGradient id="radGlow"><stop offset="0" style="stop-color:var(--brass);stop-opacity:.28"/><stop offset=".45" style="stop-color:var(--brass);stop-opacity:.09"/><stop offset="1" style="stop-color:var(--brass);stop-opacity:0"/></radialGradient>
    <radialGradient id="radRay" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="${R}"><stop offset=".08" style="stop-color:var(--brass);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--brass);stop-opacity:0"/></radialGradient>
    <clipPath id="radClip"><rect x="${x0}" y="0" width="${colW[colPos[root.f]]}" height="${totalH}"/></clipPath>
  </defs>
  <g clip-path="url(#radClip)" aria-hidden="true" style="pointer-events:none">
    <g transform="translate(${cx},${cy})">
      <circle r="${R}" fill="url(#radGlow)"/>
      <g fill="url(#radRay)">${rays}</g>
    </g>
  </g>`;
}

function shieldMarkup(n) {
  const [a, b] = n.c;
  // A downloaded badge replaces the colour shield entirely
  if (HERALDRY[n.id]) return `<image href="${esc(HERALDRY[n.id])}" x="-2" y="-2" width="24" height="28" preserveAspectRatio="xMidYMid meet"/>`;
  const img = heraldryUrl(n);
  return `<path d="M0 0H10V24C6 22 0 18 0 10Z" fill="${a}"/><path d="M10 0H20V10C20 18 14 22 10 24Z" fill="${b}"/>` +
    (img ? `<image href="${esc(img)}" x="-1" y="-1" width="22" height="26" preserveAspectRatio="xMidYMid meet" onerror="this.remove()"/>` : "") +
    `<path class="sh-o" d="M0 0H20V10C20 18 14 22 10 24C6 22 0 18 0 10Z"/>`;
}
function heraldryUrl(n) {
  if (HERALDRY[n.id]) return HERALDRY[n.id];
  if (HERALDRY_PATTERN && n.s !== "group" && n.s !== "root") return HERALDRY_PATTERN.replace("{id}", n.id);
  return "";
}

function render() {
  computeCols();
  layout();
  const W = totalW;
  let out = "";
  COLS.forEach(c => {
    if (!(c.id in colPos)) return;
    const i = colPos[c.id];
    out += c.id === "unrec"
      ? `<rect class="band unrec" x="${colLeft(i) + 4}" y="0" width="${colW[i] - 8}" height="${totalH}" rx="6"/>`
      : `<rect class="band${i % 2 ? " alt" : ""}" x="${colLeft(i)}" y="0" width="${colW[i]}" height="${totalH}"/>`;
  });
  out += radianceMarkup();
  for (const n of laid) {
    if (!n.open) continue;
    const s = nodeL(n) + BW;
    for (const k of n._vk) {
      if (k.p !== n.id) continue;   // loose Chapters get no line
      const cL = nodeL(k);
      out += `<path class="edge${k.s === "traitor" ? " to-traitor" : ""}" d="M${s} ${n.y}H${cL - 30}C${cL - 14} ${n.y} ${cL - 14} ${k.y} ${cL - 2} ${k.y}"/>`;
    }
  }
  for (const n of laid) {
    const L = nodeL(n), has = visKids(n).length > 0;
    const cls = ["node", n.s, n.num ? "legion" : "", n.conn ? "conn" : "", n.id === selected ? "sel" : ""].join(" ");
    const count = has && collapsed.has(n.id) ? `<tspan class="count"> (+${countDesc(n)})</tspan>` : "";
    const isGroup = n.s === "group";
    out += `<g class="${cls}" data-id="${n.id}" transform="translate(${L},${n.y})" tabindex="0" role="button" aria-label="${esc(n.name)}${has ? (collapsed.has(n.id) ? ", collapsed" : ", expanded") : ""}">` +
      `<rect class="hit" x="-6" y="-15" width="${BW + 10}" height="30" rx="4"/>` +
      (isGroup ? "" : `<g transform="translate(4,-12)">${shieldMarkup(n)}</g>`) +
      labelMarkup(n, isGroup ? 8 : 32, has) +
      (has ? `<g class="knob" data-act="toggle" transform="translate(${n.s === "root" ? ROOT_KNOB_X : BW - 8},0)"><circle r="8"/><text y="0">${collapsed.has(n.id) ? "+" : "−"}</text></g>` : "") +
      `</g>`;
  }
  world.innerHTML = out;
  world.dataset.w = W;
}

// Keep the tree's edges from being dragged past the edges of the view.
// When the tree is smaller than the view on an axis, it can move freely but never off-screen.
function clampView() {
  const r = stage.getBoundingClientRect();
  const open = panel.classList.contains("open");
  const vw = r.width - (open && r.width > 700 ? panel.offsetWidth : 0);
  const vh = r.height - (open && r.width <= 700 ? panel.offsetHeight : 0);
  const cw = totalW * view.k, ch = totalH * view.k;
  view.tx = Math.min(Math.max(view.tx, Math.min(0, vw - cw)), Math.max(0, vw - cw));
  // The heading strip is a fixed 84px on screen, so at any zoom the first row must be able to sit just below it
  const headroom = Math.max(0, 114 - (PADT - ROWH / 2) * view.k);
  view.ty = Math.min(Math.max(view.ty, Math.min(headroom, vh - ch)), Math.max(headroom, vh - ch));
}

function apply() {
  const mk = minZoom(); if (view.k < mk) view.k = mk;
  clampView();
  // Star layers drift slower than the tree for a sense of depth; the nebulae stay put
  const sx = view.tx, sy = view.ty;
  sky.style.backgroundPosition = `${sx * .05}px ${sy * .05}px, ${sx * .12}px ${sy * .12}px, ${sx * .22}px ${sy * .22}px, 0 0, 0 0, 0 0`;
  world.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.k})`);
  colEls.forEach((el, j) => {
    const id = COLS[j].id;
    el.hidden = !(id in colPos);
    if (el.hidden) return;
    const i = colPos[id], w = colW[i] * view.k;
    el.style.left = (view.tx + colLeft(i) * view.k) + "px";
    el.style.width = w + "px";
    el.classList.toggle("narrow", w < 150);
    el.classList.toggle("tiny", w < 70);
    el.classList.toggle("sel", id === selectedCol);
  });
  drawAges();
}

/* ============================ actions ============================ */
function toggle(id) {
  const n = byId[id], before = n.y;
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  render();
  view.ty -= (n.y - before) * view.k;
  apply();
  const el = world.querySelector(`[data-id="${id}"]`); if (el) el.focus({ preventScroll: true });
}

function reveal(n) {
  computeCols();
  if (!n.vis) { if (n.s === "traitor") setTraitors(true); else setLoyalists(true); }
  ancestors(n).forEach(a => collapsed.delete(a.id));
}

function centerOn(n) {
  const r = stage.getBoundingClientRect();
  const panelW = panel.classList.contains("open") && r.width > 700 ? panel.offsetWidth : 0;
  const mobilePanel = panel.classList.contains("open") && r.width <= 700 ? panel.offsetHeight : 0;
  if (view.k < 0.9) view.k = 0.9;   // jump to a readable zoom when going to an entry
  const cx = nodeL(n) + BW / 2;
  view.tx = (r.width - panelW) / 2 - cx * view.k;
  view.ty = (r.height - mobilePanel + 40) / 2 - n.y * view.k;
  apply();
}

function select(id, { center = false, hash = true } = {}) {
  const n = byId[id]; if (!n) return;
  reveal(n);
  selected = id; selectedCol = null; selectedAge = null;
  render();
  showPanel(n);
  trackView(n);
  if (center) centerOn(n); else apply();
  if (hash && location.hash.slice(1) !== id) location.hash = id;
}

function wikiLinks(n) {
  const t = s => encodeURIComponent(s.replace(/’/g, "'").replace(/ /g, "_")).replace(/%2F/g, "/");
  const lex = n.lex || n.name, fan = n.fan || n.name, d4 = n.d4 || n.name;
  return [
    { label: "Lexicanum", sub: "lexicanum.com", url: `https://wh40k.lexicanum.com/wiki/${t(lex)}` },
    { label: "40k Wiki", sub: "Fandom", url: `https://warhammer40k.fandom.com/wiki/${t(fan)}` },
    { label: "2d4chan", sub: "formerly 1d4chan", url: `https://2d4chan.org/wiki/${t(d4)}` }
  ];
}

/* Every entry gets a short description: hand-written where the lore is well documented,
   otherwise built from what is recorded (Founding, progenitor, fate) without inventing anything */
const HEDGE = /conflict|unconfirmed|some (lists|sources|authors)|speculated|believed|according to|implied|disagree|another places|most likely/i;
function describe(n) {
  const col = COLS[colIdx[n.f]], parent = byId[n.p], known = parent && parent.s !== "group";
  const extra = n.n && !HEDGE.test(n.n) ? " " + n.n : "";   // recorded facts, used in place of filler
  const fate = extra ? "" : n.s === "lost" ? " The Chapter is now lost." : n.s === "renegade" ? " It has since turned renegade." : "";
  if (n.f === "ultima")
    return `A Primaris Chapter raised in the Ultima Founding for Guilliman’s Indomitus Crusade.${known ? ` Its gene-seed descends from the ${parent.name}.` : " Its progenitor line has not been recorded."}${extra}${fate}`;
  const numbered = /^\d/.test(col.name);
  if (known) {
    const lead = col.id === "unrec" ? `A successor Chapter of the ${parent.name} whose Founding is unrecorded.`
      : numbered ? `A ${col.name} successor Chapter of the ${parent.name}.`
      : `A successor Chapter of the ${parent.name}, raised in ${col.date}.`;
    const flavour = parent.id === "dark-angels" ? " One of the Unforgiven, it shares the secret hunt for the Fallen."
      : parent.id === "blood-angels" ? " Like all of Sanguinius’s sons, it bears the Red Thirst and Black Rage." : "";
    return lead + flavour + (extra || (flavour ? "" : " Beyond its lineage, little of its history has been recorded.")) + fate;
  }
  const lead = col.id === "unrec" ? "A Chapter whose Founding and progenitor Legion are both unrecorded."
    : numbered ? `A ${col.name} Chapter whose progenitor Legion is unrecorded.`
    : `A Chapter raised in ${col.date} whose progenitor Legion is unrecorded.`;
  return lead + (extra || " Little is known of it beyond its name and heraldry.") + fate;
}

function statusText(n) {
  const kind = n.num ? "Legion" : "Chapter";
  if (n.s === "traitor" && !n.num) return { plague: "Death Guard Plague Company", renegade: "Renegade Chapter, fallen to Chaos", renamed: "Traitor Legion, renamed" }[n.kind] || "Traitor warband";
  return { loyal: `Loyal ${kind}`, traitor: "Traitor Legion", lost: `${kind}, lost or disbanded`, renegade: "Renegade, fallen or destroyed",
           expunged: "Records expunged", root: "Progenitor of the Astartes", group: "Grouping, not a Chapter" }[n.s];
}

function showPanel(n) {
  const col = COLS[colIdx[n.f]], parent = byId[n.p];
  const vk = (kids[n.id] || []).filter(k => k.s !== "group");
  const img = heraldryUrl(n);
  const mark = n.num || n.name.split(/\s+/).filter(w => !/^(of|the)$/i.test(w)).map(w => w[0]).join("").slice(0, 2);
  const big = n.s === "group" ? "" : `<div class="shield">
      ${HERALDRY[n.id] ? "" : `<svg viewBox="-1 -1 22 26" aria-hidden="true">${shieldMarkup({ ...n, id: "__none" }).replace(/<image[^>]*>/, "")}
        <text x="10" y="11.5" text-anchor="middle" dominant-baseline="middle" font-family="Cinzel, serif" font-weight="700" font-size="${mark.length > 3 ? 5 : 6.5}" fill="#fff" stroke="#000" stroke-width=".9" paint-order="stroke">${esc(mark)}</text></svg>`}
      ${img ? `<img src="${esc(img)}" alt="Heraldry of the ${esc(n.name)}" onerror="this.remove()">` : ""}
    </div>`;
  panel.innerHTML = `
    <button class="btn close" id="closePanel" aria-label="Close details">Close</button>
    <div class="crest">${big}
      <div><h2>${esc(n.name)}</h2><div class="status ${n.s}">${statusText(n)}</div></div>
    </div>
    <dl>
      ${n.s === "root" ? "" : `<dt>${col.era ? "Era" : "Founding"}</dt><dd>${esc(col.name)}${col.ep ? `, ${esc(col.ep.toLowerCase().startsWith("the") ? col.ep : col.ep)}` : ""}<br><span style="color:var(--muted)">${esc(col.date)}</span>${col.note ? `<br><span style="color:var(--muted);font-size:.88rem">${esc(col.note)}</span>` : ""}</dd>`}
      ${n.num ? `<dt>Legion</dt><dd>${n.num}</dd>` : ""}
      ${parent && parent.s === "group" ? `<dt>Gene-seed</dt><dd>Unrecorded</dd>` : ""}
      ${parent && parent.s !== "group" && n.s !== "group" ? `<dt>${n.s === "traitor" && !n.num ? "Origin" : "Gene-seed"}</dt><dd><button class="linkish" data-go="${parent.id}">${esc(parent.name)}</button></dd>` : ""}
      ${vk.length ? `<dt>${n.s === "group" ? "Chapters" : n.s === "traitor" ? "Offshoots" : "Successors"}</dt><dd class="kids">${vk.map(k => `<button class="linkish" data-go="${k.id}">${esc(k.name)}</button>`).join("")}</dd>` : ""}
    </dl>
    ${n.s === "group" ? "" : `<p class="note">${esc(n.d || describe(n))}</p>`}
    ${n.n && HEDGE.test(n.n) ? `<p class="note aside">${esc(n.n)}</p>` : ""}
    ${n.s === "group" ? "" : `<h3>Read more</h3><div class="wikis">${wikiLinks(n).map(l => `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}<small>${esc(l.sub)}</small></a>`).join("")}</div>`}
    ${HERALDRY_SOURCE.url && img ? `<p class="fine">Heraldry: <a href="${esc(HERALDRY_SOURCE.url)}" target="_blank" rel="noopener noreferrer">${esc(HERALDRY_SOURCE.label || HERALDRY_SOURCE.url)}</a></p>` : ""}
    ${n.s === "group" ? "" : `<p style="margin-top:1rem"><button class="linkish" data-feedback="${n.id}">Suggest a correction to this entry</button></p>`}
    ${n.s === "group" ? "" : `<p class="fine">${img ? "" : "Shield shows an approximate colour scheme, not the badge. "}${n.inherited ? "Colours inherited from the progenitor until filled in." : ""}</p>`}`;
  panel.classList.add("open");
}

function closePanel() {
  panel.classList.remove("open"); selected = null; selectedCol = null; selectedAge = null; render(); apply();
  history.replaceState(null, "", location.pathname + location.search);
}

function setTraitors(on) {
  showTraitors = on;
  const b = document.getElementById("traitors");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? "Traitors shown" : "Traitors hidden";
}

function setLoyalists(on) {
  showLoyalists = on;
  const b = document.getElementById("loyalists");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? "Loyalists shown" : "Loyalists hidden";
}

function refilter() {
  computeCols();
  if (selected && !byId[selected].vis) closePanel(); else { render(); apply(); }
}

// Furthest zoom-out: the whole tree on screen, but never so small that names become unreadable
function minZoom() {
  const r = stage.getBoundingClientRect();
  const fitK = Math.min(r.width / (totalW + 40), (r.height - 10) / totalH);
  return Math.min(1, Math.max(0.3, fitK));
}

function fit() {
  const r = stage.getBoundingClientRect(), W = totalW;
  view.k = minZoom();
  view.tx = (r.width - W * view.k) / 2;
  view.ty = 0;
  apply();
}

function initialView() {
  const r = stage.getBoundingClientRect(), W = totalW;
  view.k = Math.max(0.6, Math.min(1, (r.height - 10) / totalH));
  if (r.width < 700) view.k = 0.7;
  view.tx = 10;   // origin pinned to the left edge
  view.ty = 0;
  apply();
}

function zoomAt(cx, cy, f) {
  const r = stage.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  const nk = Math.max(minZoom(), Math.min(2.4, view.k * f));
  view.tx = x - (x - view.tx) * nk / view.k;
  view.ty = y - (y - view.ty) * nk / view.k;
  view.k = nk; apply();
}

/* ============================ input ============================ */
const pts = new Map(); let moved = 0, pinch = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("#panel")) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = 0;
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
  }
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
  pts.set(e.pointerId, cur);
  if (pts.size === 1) {
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4) {
      if (!stage.hasPointerCapture(e.pointerId)) { stage.setPointerCapture(e.pointerId); stage.classList.add("dragging"); }
      view.tx += dx; view.ty += dy; apply();
    }
  } else if (pts.size === 2 && pinch) {
    moved = 99;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (pinch.k * d / pinch.d) / view.k);
  }
});
const endPtr = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("wheel", e => {
  if (e.target.closest("#panel")) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });

world.addEventListener("click", e => {
  if (moved > 4) return;
  const node = e.target.closest(".node"); if (!node) return;
  if (e.target.closest('[data-act="toggle"]')) toggle(node.dataset.id);
  else select(node.dataset.id);
});
world.addEventListener("keydown", e => {
  const node = e.target.closest(".node"); if (!node) return;
  const id = node.dataset.id;
  if (e.key === "Enter") { e.preventDefault(); select(id); }
  else if (e.key === " ") { e.preventDefault(); if (visKids(byId[id]).length) toggle(id); }
});
panel.addEventListener("click", e => {
  const fbk = e.target.closest("[data-feedback]");
  if (fbk) { openFeedback("Correction", byId[fbk.dataset.feedback].name); return; }
  const go = e.target.closest("[data-go]");
  if (go) select(go.dataset.go, { center: true });
  if (e.target.closest("#closePanel")) closePanel();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !fb.open && panel.classList.contains("open")) closePanel(); });

document.getElementById("search").addEventListener("change", e => {
  const q = e.target.value.trim().toLowerCase().replace(/'/g, "’"); if (!q) return;
  const n = NODES.find(n => n.name.toLowerCase() === q) || NODES.find(n => n.name.toLowerCase().includes(q));
  if (n) { select(n.id, { center: true }); e.target.value = ""; }
});
document.getElementById("traitors").addEventListener("click", () => {
  setTraitors(!showTraitors);
  if (!showTraitors && !showLoyalists) setLoyalists(true);   // never hide everything
  refilter();
});
document.getElementById("loyalists").addEventListener("click", () => {
  setLoyalists(!showLoyalists);
  if (!showTraitors && !showLoyalists) setTraitors(true);
  refilter();
});
document.getElementById("expandAll").addEventListener("click", () => { collapsed.clear(); render(); apply(); });
document.getElementById("collapseAll").addEventListener("click", () => {
  NODES.forEach(n => { if (n.id !== "emperor" && (kids[n.id] || []).length) collapsed.add(n.id); });
  render(); initialView();
});
document.getElementById("zoomIn").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); });
document.getElementById("zoomOut").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 0.8); });
document.getElementById("fit").addEventListener("click", fit);

window.addEventListener("resize", () => apply());

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id.startsWith("age-")) { if (id.slice(4) !== selectedAge) showAgePanel(id.slice(4), { hash: false, scroll: true }); return; }
  if (id.startsWith("founding-")) { if (id.slice(9) !== selectedCol) showFoundingPanel(id.slice(9), { hash: false, scroll: true }); return; }
  if (byId[id] && id !== selected) select(id, { center: true, hash: false });
});

/* ============================ boot ============================ */
/* ============================ founding panels ============================
   Clicking a column heading opens an overview of that Founding.
   text: short overview; links: [lexicanum, fandom, 2d4chan] page titles,
   or "?term" to link to that wiki's search for the term instead. */
const FOUNDING_INFO = {
  origin: { text: ["The Emperor of Mankind created the twenty Primarchs, and from their gene-seed the twenty Space Marine Legions. Every Legion, Chapter and warband on this chart traces its gene-seed back to one of them."],

};

function foundingLinks(cid) { return wikiTriple((FOUNDING_INFO[cid] || {}).links || ["Founding", "?Founding", "?Founding"]); }
function wikiTriple(L) {
  const t = s => encodeURIComponent(s.replace(/’/g, "'").replace(/ /g, "_")).replace(/%2F/g, "/");
  const q = s => encodeURIComponent(s.slice(1));
  return [
    { label: "Lexicanum", sub: "lexicanum.com", url: L[0][0] === "?" ? `https://wh40k.lexicanum.com/mediawiki/index.php?search=${q(L[0])}` : `https://wh40k.lexicanum.com/wiki/${t(L[0])}` },
    { label: "40k Wiki", sub: L[1][0] === "?" ? "Fandom search" : "Fandom", url: L[1][0] === "?" ? `https://warhammer40k.fandom.com/wiki/Special:Search?query=${q(L[1])}` : `https://warhammer40k.fandom.com/wiki/${t(L[1])}` },
    { label: "2d4chan", sub: L[2][0] === "?" ? "search" : "formerly 1d4chan", url: L[2][0] === "?" ? `https://2d4chan.org/index.php?search=${q(L[2])}` : `https://2d4chan.org/wiki/${t(L[2])}` }
  ];
}

function legionOf(n) {
  let a = n;
  while (a && a.p && byId[a.p] && byId[a.p].s !== "root" && byId[a.p].s !== "group") a = byId[a.p];
  return a && a.p && byId[a.p] && byId[a.p].s === "root" ? a : null;
}
function showFoundingPanel(cid, { hash = true, scroll = false } = {}) {
  const c = COLS[colIdx[cid]]; if (!c) return;
  selected = null; selectedCol = cid; selectedAge = null;
  const members = NODES.filter(n => n.f === cid && n.s !== "group");
  const count = s => members.filter(n => n.s === s).length;
  const kind = cid === "warbands" || cid === "fallen" ? "entries" : cid === "f1" ? "Legions" : "Chapters";
  const status = [["loyal", "loyal"], ["traitor", "traitor"], ["renegade", "renegade"], ["lost", "destroyed or lost"], ["expunged", "expunged"]]
    .map(([s, label]) => [count(s), label]).filter(([k]) => k).map(([k, label]) => `${k} ${label}`).join(", ");
  const lines = {};
  members.forEach(n => { const l = legionOf(n); const key = l ? l.name : "Unrecorded"; lines[key] = (lines[key] || 0) + 1; });
  const lineList = Object.entries(lines).sort((a, b) => b[1] - a[1]);
  const showLines = cid !== "f1" && cid !== "origin" && lineList.length;
  const info = FOUNDING_INFO[cid] || { text: [] };
  const sorted = members.slice().sort((a, b) => a.name.localeCompare(b.name));
  panel.innerHTML = `
    <button class="btn close" id="closePanel" aria-label="Close details">Close</button>
    <div class="crest"><div><h2>${esc(c.name)}</h2><div class="status">${esc([c.ep, c.date].filter(Boolean).join(", "))}</div></div></div>
    ${info.text.map(p => `<p class="note">${esc(p)}</p>`).join("")}
    ${c.note ? `<p class="note aside">${esc(c.note)}</p>` : ""}
    <dl>
      <dt>On this chart</dt><dd>${members.length} ${members.length === 1 ? kind.replace(/s$/, "") : kind}${status ? `<br><span style="color:var(--muted)">${status}</span>` : ""}</dd>
      ${showLines ? `<dt>Gene-lines</dt><dd>${lineList.slice(0, 8).map(([k, v]) => `${esc(k)} ${v}`).join("<br>")}${lineList.length > 8 ? `<br><span style="color:var(--muted)">and ${lineList.length - 8} more</span>` : ""}</dd>` : ""}
    </dl>
    ${sorted.length && sorted.length <= 40 ? `<h3>${kind === "entries" ? "Entries" : kind}</h3><div class="kids">${sorted.map(k => `<button class="linkish" data-go="${k.id}">${esc(k.name)}</button>`).join("")}</div>` : ""}
    <h3>Read more</h3><div class="wikis">${foundingLinks(cid).map(l => `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}<small>${esc(l.sub)}</small></a>`).join("")}</div>
    <p style="margin-top:1rem"><button class="linkish" data-feedback-col="${cid}">Suggest a correction to this Founding</button></p>`;
  panel.classList.add("open");
  render();
  if (scroll && cid in colPos) view.tx = 40 - colLeft(colPos[cid]) * view.k;   // bring the column into view
  apply();
  if (hash && location.hash.slice(1) !== "founding-" + cid) location.hash = "founding-" + cid;
}
colsEl.addEventListener("click", e => {
  if (moved > 4) return;
  const el = e.target.closest(".col"); if (!el) return;
  showFoundingPanel(COLS[colEls.indexOf(el)].id);
});
colsEl.addEventListener("keydown", e => {
  const el = e.target.closest(".col"); if (!el || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault(); showFoundingPanel(COLS[colEls.indexOf(el)].id);
});
panel.addEventListener("click", e => {
  const c = e.target.closest("[data-col]");
  if (c) { showFoundingPanel(c.dataset.col, { scroll: true }); return; }
  const b = e.target.closest("[data-feedback-col]");
  if (b) openFeedback("Correction", COLS[colIdx[b.dataset.feedbackCol]].name);
});

/* ============================ feedback ============================ */
const fb = document.getElementById("fb");
function openFeedback(type = "Suggestion", entry = "") {
  document.getElementById("fbType").value = type;
  document.getElementById("fbEntry").value = entry;
  document.getElementById("fbMsg").value = "";
  document.getElementById("fbSend").disabled = false;
  document.getElementById("fbStatus").textContent = "";
  fb.showModal();
  document.getElementById("fbMsg").focus();
}
document.getElementById("feedbackBtn").addEventListener("click", () => openFeedback("Suggestion", selected ? byId[selected].name : ""));
document.getElementById("fbCancel").addEventListener("click", () => fb.close());
document.getElementById("fbSend").addEventListener("click", async () => {
  const type = document.getElementById("fbType").value;
  const entry = document.getElementById("fbEntry").value.trim();
  const msg = document.getElementById("fbMsg").value.trim();
  const status = document.getElementById("fbStatus");
  if (!msg) { status.textContent = "Please add some details first."; return; }
  const title = `${type}${entry ? ": " + entry : ""}`;
  const body = `${msg}\n\n---\nType: ${type}${entry ? "\nEntry: " + entry : ""}\nPage: ${location.href}`;
  const from = document.getElementById("fbFrom").value.trim();
  const sendBtn = document.getElementById("fbSend");
  const copyFallback = async lead => {
    try { await navigator.clipboard.writeText(title + "\n\n" + body); status.textContent = lead + " Your message was copied to the clipboard."; }
    catch { status.textContent = lead + " Please copy your message and try again later."; }
  };
  if (FEEDBACK.formspree) {
    sendBtn.disabled = true; status.textContent = "Sending…";
    try {
      const res = await fetch(`https://formspree.io/f/${FEEDBACK.formspree}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ _subject: "[Astartes lineage] " + title, type, entry, message: msg, page: location.href, ...(from ? { email: from } : {}) })
      });
      if (!res.ok) throw new Error(res.status);
      status.textContent = "Thanks, your feedback has been sent.";
      setTimeout(() => fb.close(), 1600);
    } catch {
      sendBtn.disabled = false;
      await copyFallback("Sorry, that didn’t send.");
    }
  } else if (FEEDBACK.github) {
    window.open(`https://github.com/${FEEDBACK.github}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
    fb.close();
  } else if (FEEDBACK.email) {
    location.href = `mailto:${FEEDBACK.email}?subject=${encodeURIComponent("[Astartes lineage] " + title)}&body=${encodeURIComponent(body)}`;
    fb.close();
  } else {
    await copyFallback("Feedback isn’t connected yet.");
  }
});

/* ============================ starfield ============================ */
const sky = document.getElementById("sky");
function starTile(size, count, rMin, rMax, aMin, aMax, seed, rgb, k, glow) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let c = "";
  for (let i = 0; i < count; i++) {
    const x = (rnd() * size).toFixed(1), y = (rnd() * size).toFixed(1);
    const r = (rMin + rnd() * (rMax - rMin)).toFixed(2), a = ((aMin + rnd() * (aMax - aMin)) * k).toFixed(2);
    if (glow) c += `<circle cx='${x}' cy='${y}' r='${(r * 3.2).toFixed(1)}' fill='rgba(${rgb},${(a * .12).toFixed(3)})'/>`;
    c += `<circle cx='${x}' cy='${y}' r='${r}' fill='rgba(${rgb},${a})'/>`;
  }
  return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>${c}</svg>`)}")`;
}
function paintSky() {
  const cs = getComputedStyle(document.documentElement);
  const rgb = cs.getPropertyValue("--star-rgb").trim() || "232,226,210";
  const k = parseFloat(cs.getPropertyValue("--star-a")) || 1;
  sky.style.backgroundImage = [
    starTile(420, 140, .35, .7, .10, .32, 11, rgb, k, false),   // distant dust
    starTile(560, 55, .6, 1.0, .20, .50, 29, rgb, k, false),    // mid stars
    starTile(760, 9, 1.0, 1.5, .45, .75, 47, rgb, k, true),     // a few bright ones
    "radial-gradient(ellipse 55% 45% at 18% 28%, var(--neb1), transparent 70%)",
    "radial-gradient(ellipse 50% 55% at 82% 72%, var(--neb2), transparent 70%)",
    "radial-gradient(ellipse 35% 30% at 60% 15%, var(--neb3), transparent 70%)"
  ].join(",");
}
paintSky();
// Badge list written by fetch_heraldry.py as heraldry/index.js (works even when opened from disk)
if (window.HERALDRY_INDEX) { Object.assign(HERALDRY, window.HERALDRY_INDEX); render(); apply(); }
// Pick up downloaded badges when self-hosted (silently does nothing where the file is absent)
if (HERALDRY_MANIFEST && location.protocol.startsWith("http")) {
  fetch(HERALDRY_MANIFEST, { cache: "no-cache" })
    .then(r => r.ok ? r.json() : null)
    .then(m => { if (!m) return; Object.assign(HERALDRY, m); render(); apply(); if (selected) showPanel(byId[selected]); })
    .catch(() => {});
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintSky);

render();
initialView();
// Re-wrap names once the web fonts have loaded, since their widths differ from the fallbacks
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); apply(); });
const start = location.hash.slice(1);
if (byId[start]) select(start, { center: true, hash: false });
else if (start.startsWith("age-")) showAgePanel(start.slice(4), { hash: false, scroll: true });
else if (start.startsWith("founding-") && colIdx[start.slice(9)] != null) showFoundingPanel(start.slice(9), { hash: false, scroll: true });
</script>
